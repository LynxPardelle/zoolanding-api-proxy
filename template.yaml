AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Zoolanding API Proxy Lambda - SAM Template

Parameters:
  ConfigTableName:
    Type: String
    Default: zoolanding-config-registry
    Description: DynamoDB table that stores site routing, lifecycle, and version metadata.
  ConfigPayloadsBucketName:
    Type: String
    Default: zoolanding-config-payloads
    Description: S3 bucket that stores versioned site payloads including server-only integration policy.
  ApiStageName:
    Type: String
    Default: Prod
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    Description: Reserved for output compatibility. The existing production stack keeps a literal Prod stage to preserve SAM-generated logical IDs.
  AuthRuntimeEnvironment:
    Type: String
    Default: prod
    AllowedValues: [dev, test, prod]
    Description: Runtime environment assigned server-side to custom auth users created through this stack.
  AllowedCorsOrigins:
    Type: String
    Default: https://zoolandingpage.com.mx,https://test.zoolandingpage.com.mx
    Description: Comma-separated browser origins allowed to call the proxy API. Localhost and 127.0.0.1 are allowed by the Lambda for local QA.
  SecretNamePrefix:
    Type: String
    Default: zoolanding/api/
    Description: Secrets Manager name prefix for draft API credentials.
  AuthRegistryFileName:
    Type: String
    Default: auth-profile-registry.json
    Description: Server-only auth profile registry file under each published draft server folder.
  AuthProvisioningAllowedRoleNames:
    Type: String
    Default: ''
    Description: Comma-separated IAM role names allowed to read plan-only auth provisioning plans.
  AuthProvisioningAllowedRoleArns:
    Type: String
    Default: ''
    Description: Comma-separated IAM role ARNs allowed to read plan-only auth provisioning plans.
  AuthProvisioningStateTableName:
    Type: String
    Default: zoolanding-auth-provisioning-state
    Description: DynamoDB table for auth provisioning state and audit records.
  AuthProvisioningStateTableMode:
    Type: String
    Default: create
    AllowedValues: [create, existing]
    Description: Create the auth provisioning state table or use an existing table name.
  AuthProvisioningApplyEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Guardrail flag for future real Cognito apply. Keep false until explicitly approved.
  AuthProvisioningApplyAllowedDomains:
    Type: String
    Default: ''
    Description: Comma-separated site domains allowed for real auth provisioning apply.
  AuthProvisioningApplyAllowedTenants:
    Type: String
    Default: ''
    Description: Comma-separated tenant IDs allowed for real auth provisioning apply.
  AuthProvisioningSecretParameterPrefix:
    Type: String
    Default: zoolanding/auth/
    Description: SSM Parameter Store hierarchy prefix for auth provisioning IdP credential references, without a leading slash for IAM ARNs.
  AuthProvisioningSecretNamePrefix:
    Type: String
    Default: /zoolanding/auth/
    Description: Secrets Manager name prefix for auth provisioning IdP credential references.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: Log level for the Lambda.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 15
    MemorySize: 256
    Tracing: PassThrough

Conditions:
  CreateAuthProvisioningStateTable:
    Fn::Equals:
      - Ref: AuthProvisioningStateTableMode
      - create
Resources:
  ApiProxyApi:
    Type: AWS::Serverless::Api
    Properties:
      # Keep this literal for the existing production stack. Parameterizing it
      # changes SAM-generated logical IDs and tries to replace the live Prod stage.
      StageName: Prod
      Auth:
        Authorizers:
          DraftJwtRequestAuthorizer:
            FunctionArn:
              Fn::GetAtt:
                - AuthJwtAuthorizerFunction
                - Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers:
                - Authorization
                - x-zoolanding-domain
                - x-zoolanding-auth-profile-id
              ReauthorizeEvery: 0

  ApiProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Description: Resolves draft server-only API integration policies and proxies safe upstream requests.
      Environment:
        Variables:
          CONFIG_TABLE_NAME:
            Ref: ConfigTableName
          CONFIG_PAYLOADS_BUCKET_NAME:
            Ref: ConfigPayloadsBucketName
          ALLOWED_CORS_ORIGINS:
            Ref: AllowedCorsOrigins
          AUTH_REGISTRY_FILE_NAME:
            Ref: AuthRegistryFileName
          AUTH_PROVISIONING_ALLOWED_ROLE_NAMES:
            Ref: AuthProvisioningAllowedRoleNames
          AUTH_PROVISIONING_ALLOWED_ROLE_ARNS:
            Ref: AuthProvisioningAllowedRoleArns
          AUTH_PROVISIONING_STATE_TABLE_NAME:
            Ref: AuthProvisioningStateTableName
          AUTH_RUNTIME_ENVIRONMENT:
            Ref: AuthRuntimeEnvironment
          LOG_LEVEL:
            Ref: LogLevel
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigTableName}
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                Fn::Sub: arn:aws:s3:::${ConfigPayloadsBucketName}/*
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SecretNamePrefix}*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthProvisioningStateTableName}
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:SignUp
                - cognito-idp:ConfirmSignUp
                - cognito-idp:ResendConfirmationCode
                - cognito-idp:ForgotPassword
                - cognito-idp:ConfirmForgotPassword
              Resource: '*'
            - Effect: Allow
              Action:
                - cognito-idp:AdminAddUserToGroup
              Resource:
                Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
      Events:
        ApiProxyRead:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /api-proxy/read
            Method: POST
        ApiProxyReadOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /api-proxy/read
            Method: OPTIONS
        ApiProxyAction:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /api-proxy/action
            Method: POST
        ApiProxyActionOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /api-proxy/action
            Method: OPTIONS
        AuthRuntimeConfigGet:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/runtime-config
            Method: GET
        AuthRuntimeConfigPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/runtime-config
            Method: POST
        AuthRuntimeConfigOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/runtime-config
            Method: OPTIONS
        AuthSigninPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/signin
            Method: POST
        AuthSigninOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/signin
            Method: OPTIONS
        AuthSignupPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/signup
            Method: POST
        AuthSignupOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/signup
            Method: OPTIONS
        AuthConfirmSignupPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/confirm-signup
            Method: POST
        AuthConfirmSignupOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/confirm-signup
            Method: OPTIONS
        AuthResendConfirmationPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/resend-confirmation
            Method: POST
        AuthResendConfirmationOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/resend-confirmation
            Method: OPTIONS
        AuthForgotPasswordPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/forgot-password
            Method: POST
        AuthForgotPasswordOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/forgot-password
            Method: OPTIONS
        AuthConfirmForgotPasswordPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/confirm-forgot-password
            Method: POST
        AuthConfirmForgotPasswordOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/confirm-forgot-password
            Method: OPTIONS
        AuthProvisioningPlanPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/provisioning-plan
            Method: POST
            Auth:
              Authorizer: AWS_IAM
        AuthProvisioningPlanOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/provisioning-plan
            Method: OPTIONS

  AuthProvisioningStateTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateAuthProvisioningStateTable
    Properties:
      TableName:
        Ref: AuthProvisioningStateTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AuthProvisioningExecutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: auth_service.auth_lambda_handler
      Description: Server-only auth provisioning executor boundary. Apply remains guarded by feature flag.
      Environment:
        Variables:
          CONFIG_TABLE_NAME:
            Ref: ConfigTableName
          CONFIG_PAYLOADS_BUCKET_NAME:
            Ref: ConfigPayloadsBucketName
          ALLOWED_CORS_ORIGINS:
            Ref: AllowedCorsOrigins
          AUTH_REGISTRY_FILE_NAME:
            Ref: AuthRegistryFileName
          AUTH_PROVISIONING_ALLOWED_ROLE_NAMES:
            Ref: AuthProvisioningAllowedRoleNames
          AUTH_PROVISIONING_ALLOWED_ROLE_ARNS:
            Ref: AuthProvisioningAllowedRoleArns
          AUTH_PROVISIONING_STATE_TABLE_NAME:
            Ref: AuthProvisioningStateTableName
          AUTH_RUNTIME_ENVIRONMENT:
            Ref: AuthRuntimeEnvironment
          AUTH_PROVISIONING_APPLY_ENABLED:
            Ref: AuthProvisioningApplyEnabled
          AUTH_PROVISIONING_APPLY_ALLOWED_DOMAINS:
            Ref: AuthProvisioningApplyAllowedDomains
          AUTH_PROVISIONING_APPLY_ALLOWED_TENANTS:
            Ref: AuthProvisioningApplyAllowedTenants
          LOG_LEVEL:
            Ref: LogLevel
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigTableName}
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                Fn::Sub: arn:aws:s3:::${ConfigPayloadsBucketName}/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthProvisioningStateTableName}
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AuthProvisioningSecretParameterPrefix}*
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AuthProvisioningSecretNamePrefix}*
            - Effect: Allow
              Action:
                - cognito-idp:CreateUserPool
                - cognito-idp:DescribeUserPoolDomain
                - cognito-idp:ListUserPools
              Resource: '*'
            - Effect: Allow
              Action:
                - cognito-idp:CreateGroup
                - cognito-idp:CreateIdentityProvider
                - cognito-idp:CreateUserPoolClient
                - cognito-idp:CreateUserPoolDomain
                - cognito-idp:AddCustomAttributes
                - cognito-idp:DescribeIdentityProvider
                - cognito-idp:DescribeUserPool
                - cognito-idp:DescribeUserPoolClient
                - cognito-idp:ListGroups
                - cognito-idp:ListTagsForResource
                - cognito-idp:ListUserPoolClients
                - cognito-idp:SetUserPoolMfaConfig
                - cognito-idp:TagResource
                - cognito-idp:UpdateIdentityProvider
                - cognito-idp:UpdateUserPoolClient
              Resource:
                Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
      Events:
        AuthProvisioningExecutorPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/provisioning-executor
            Method: POST
            Auth:
              Authorizer: AWS_IAM
        AuthProvisioningExecutorOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiProxyApi
            Path: /auth/provisioning-executor
            Method: OPTIONS

  AuthJwtAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: auth_service.jwt_authorizer_handler
      Description: Reusable JWT Lambda authorizer for protected Zoolanding APIs.
      Environment:
        Variables:
          CONFIG_TABLE_NAME:
            Ref: ConfigTableName
          CONFIG_PAYLOADS_BUCKET_NAME:
            Ref: ConfigPayloadsBucketName
          AUTH_REGISTRY_FILE_NAME:
            Ref: AuthRegistryFileName
          AUTH_PROVISIONING_STATE_TABLE_NAME:
            Ref: AuthProvisioningStateTableName
          AUTH_RUNTIME_ENVIRONMENT:
            Ref: AuthRuntimeEnvironment
          LOG_LEVEL:
            Ref: LogLevel
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigTableName}
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                Fn::Sub: arn:aws:s3:::${ConfigPayloadsBucketName}/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthProvisioningStateTableName}

Outputs:
  ApiUrl:
    Description: API proxy base URL.
    Value:
      Fn::Sub: https://${ApiProxyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  ReadEndpoint:
    Description: Runtime data source read endpoint URL.
    Value:
      Fn::Sub: https://${ApiProxyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api-proxy/read
  ActionEndpoint:
    Description: Runtime API action endpoint URL.
    Value:
      Fn::Sub: https://${ApiProxyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api-proxy/action
  AuthRuntimeConfigEndpoint:
    Description: Public runtime auth config endpoint URL.
    Value:
      Fn::Sub: https://${ApiProxyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/runtime-config
  AuthProvisioningPlanEndpoint:
    Description: Server-only plan-only auth provisioning endpoint URL.
    Value:
      Fn::Sub: https://${ApiProxyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/provisioning-plan
  AuthProvisioningExecutorEndpoint:
    Description: Server-only dry-run Cognito provisioning executor endpoint URL.
    Value:
      Fn::Sub: https://${ApiProxyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth/provisioning-executor
  AuthProvisioningExecutorFunctionName:
    Description: Server-only auth provisioning executor Lambda function name.
    Value:
      Ref: AuthProvisioningExecutorFunction
  AuthProvisioningStateTableName:
    Description: DynamoDB table name for auth provisioning state and audit records.
    Value:
      Ref: AuthProvisioningStateTableName
  FunctionName:
    Description: Deployed Lambda function name.
    Value:
      Ref: ApiProxyFunction
  AuthJwtAuthorizerFunctionName:
    Description: Reusable JWT authorizer Lambda function name.
    Value:
      Ref: AuthJwtAuthorizerFunction
  AuthJwtAuthorizerFunctionArn:
    Description: Reusable JWT authorizer Lambda function ARN.
    Value:
      Fn::GetAtt:
        - AuthJwtAuthorizerFunction
        - Arn
