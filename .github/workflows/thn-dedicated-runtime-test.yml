name: Dedicated THN Runtime Test

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify without mutation or create the exact reviewed standalone stack
        type: choice
        options: [verify, create]
        default: verify
        required: true
      source_sha:
        description: Reviewed full TEST source SHA
        type: string
        required: true
      template_sha256:
        description: Reviewed SHA-256 of the dedicated SAM template
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: zoolanding-api-proxy-test
  cancel-in-progress: false

jobs:
  dedicated-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      THN_TEMPLATE_SHA256: ${{ inputs.template_sha256 }}
      SAM_ARTIFACTS_BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.THN_DEDICATED_RUNTIME_CFN_ROLE_ARN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify TEST identity before credentials
        run: python tools/thn_dedicated_runtime_test.py --check-context
      - name: Verify exact checked-out source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git status --porcelain)" = ""
      - name: Install pinned translation and SDK dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.84 PyYAML==6.0.3 aws-sam-translator==1.111.0
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify or create only the dedicated stack
        shell: bash
        env:
          THN_FIRST_PLAN_REFERENCE_JSON: ${{ secrets.THN_FIRST_PLAN_REFERENCE_JSON }}
        run: python tools/thn_dedicated_runtime_test.py --operation "${{ inputs.operation }}"
