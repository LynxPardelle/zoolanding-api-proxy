name: Retained THN Routes Test

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Close or restore only the captured THN runtime GET and POST
        type: choice
        options: [close, reopen]
        default: close
        required: true
      execution:
        description: Verification only unless the exact execution is separately approved
        type: choice
        options: [verify, execute]
        default: verify
        required: true
      tooling_sha:
        description: Reviewed current TEST tooling full commit SHA
        type: string
        required: true
      tooling_workflow_sha256:
        description: Reviewed LF-normalized workflow SHA-256
        type: string
        required: true
      record_sha256:
        description: Reviewed canonical digest of the private retained-route record
        type: string
        required: true
      current_baseline_sha256:
        description: Fresh reviewed current baseline digest
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: zoolanding-api-proxy-test
  cancel-in-progress: false

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      PYTHONDONTWRITEBYTECODE: '1'
      TOOLING_SHA: ${{ inputs.tooling_sha }}
      TOOLING_WORKFLOW_SHA256: ${{ inputs.tooling_workflow_sha256 }}
      ROUTE_OPERATION: ${{ inputs.operation }}
      ROUTE_EXECUTION: ${{ inputs.execution }}
      ROUTE_RECORD_SHA256: ${{ inputs.record_sha256 }}
      CURRENT_BASELINE_SHA256: ${{ inputs.current_baseline_sha256 }}
      THN_RETAINED_ROUTES_REFERENCE_JSON: ${{ secrets.THN_RETAINED_ROUTES_REFERENCE_JSON }}
      SAM_ARTIFACTS_BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify sealed context before AWS credentials
        run: python tools/thn_runtime_routes.py --check-workflow
      - name: Install owning SDK dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.84 PyYAML==6.0.3
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify or apply exact retained-route transition
        run: python tools/thn_runtime_routes.py
