name: Recover AWS Observed Test

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify only, or explicitly execute the reviewed code-only recovery
        type: choice
        options: [verify, execute]
        default: verify
        required: true
      tooling_sha:
        description: Reviewed current TEST tooling full commit SHA, never the prior payload source
        type: string
        required: true
      tooling_workflow_sha256:
        description: SHA-256 of this reviewed workflow with LF newlines
        type: string
        required: true
      snapshot_sha256:
        description: Reviewed canonical digest of the approved private AWS-observed record
        type: string
        required: true
      current_baseline_sha256:
        description: Fresh reviewed live baseline digest, not the historical capture baseline
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: zoolanding-api-proxy-test
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      PYTHONDONTWRITEBYTECODE: '1'
      RECOVERY_OPERATION: ${{ inputs.operation }}
      TOOLING_SHA: ${{ inputs.tooling_sha }}
      TOOLING_WORKFLOW_SHA256: ${{ inputs.tooling_workflow_sha256 }}
      SNAPSHOT_SHA256: ${{ inputs.snapshot_sha256 }}
      CURRENT_BASELINE_SHA256: ${{ inputs.current_baseline_sha256 }}
      AWS_LIVE_SNAPSHOT_REFERENCE_JSON: ${{ secrets.AWS_LIVE_SNAPSHOT_REFERENCE_JSON }}
      SAM_ARTIFACTS_BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify explicit provenance and current tooling before AWS credentials
        run: python tools/aws_live_snapshot.py --check-workflow
      - name: Install owning recovery SDK dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.84 PyYAML==6.0.3
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify or explicitly execute original-byte code-only recovery
        env:
          AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/aws_live_snapshot.py --operation "$RECOVERY_OPERATION"
