name: First THN Runtime Provisioning Test

on:
  workflow_dispatch:
    inputs:
      execution:
        description: Verify only unless this exact private plan is approved for execution
        type: choice
        options: [verify, execute]
        default: verify
        required: true
      tooling_sha:
        description: Reviewed current TEST source SHA
        type: string
        required: true
      tooling_workflow_sha256:
        description: Reviewed LF-normalized workflow SHA-256
        type: string
        required: true
      plan_sha256:
        description: Reviewed canonical private first-provisioning plan digest
        type: string
        required: true
      snapshot_sha256:
        description: Reviewed original private recovery snapshot digest
        type: string
        required: true
      current_baseline_sha256:
        description: Fresh reviewed native TEST baseline digest
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: zoolanding-api-proxy-test
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      SAM_CLI_TELEMETRY: '0'
      TOOLING_SHA: ${{ inputs.tooling_sha }}
      TOOLING_WORKFLOW_SHA256: ${{ inputs.tooling_workflow_sha256 }}
      FIRST_EXECUTION: ${{ inputs.execution }}
      FIRST_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      SNAPSHOT_SHA256: ${{ inputs.snapshot_sha256 }}
      CURRENT_BASELINE_SHA256: ${{ inputs.current_baseline_sha256 }}
      THN_FIRST_PLAN_REFERENCE_JSON: ${{ secrets.THN_FIRST_PLAN_REFERENCE_JSON }}
      AWS_LIVE_SNAPSHOT_REFERENCE_JSON: ${{ secrets.AWS_LIVE_SNAPSHOT_REFERENCE_JSON }}
      SAM_ARTIFACTS_BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify sealed context before AWS credentials
        run: python tools/thn_first_provisioning.py --check-workflow
      - name: Verify exact current dev to TEST merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test "$commit" = "$TOOLING_SHA"
          test -n "$first_parent"
          test -n "$second_parent"
          test -z "${extra:-}"
          test "$second_parent" = "$(git rev-parse refs/remotes/origin/dev)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/remotes/origin/dev^{tree}')"
      - name: Install pinned native translation and SDK dependencies
        run: python -m pip install --disable-pip-version-check boto3==1.43.84 PyYAML==6.0.3 aws-sam-translator==1.111.0
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify or apply only the sealed native THN extension
        run: python tools/thn_first_provisioning.py
